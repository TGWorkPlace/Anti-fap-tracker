<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Fap Tracker</title>
<style>
  * {{ box-sizing: border-box; margin: 0; padding: 0; }}
  html, body {{
    background: #000;
    font-family: 'Arial Black', Arial, sans-serif;
    width: 100%;
    overflow-x: hidden;
  }}
  body {{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 16px 10px 40px;
  }}
  .card {{
    position: relative;
    width: 100%;
    max-width: 700px;
    background: #000;
    border: 1px solid #1a1a1a;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }}

  /* ===================== HEADER (shared) ===================== */
  .header {{
    position: relative;
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
  }}
  .avatar {{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #2a2a2a;
    flex-shrink: 0;
  }}
  .user-info {{
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }}
  .user-name {{
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }}
  .user-tag {{
    color: #888;
    font-size: 7px;
    letter-spacing: 0.3px;
    margin-top: 2px;
    font-weight: 400;
    line-height: 1.3;
  }}
  .title-wrap {{
    flex: 1;
    text-align: center;
    min-width: 0;
  }}
  .title-weekly {{
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }}
  .title-monthly {{
    color: #fff;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }}
  .subtitle {{
    color: #777;
    font-size: 7px;
    letter-spacing: 1.5px;
    font-weight: 400;
    margin-top: 3px;
  }}
  .bg-flame {{
    position: absolute;
    top: 6px;
    right: 10px;
    width: 42px;
    height: 42px;
    opacity: 0.35;
  }}

  /* ===================== WEEKLY GRID ===================== */
  .week-grid {{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid #1f1f1f;
    border-bottom: 1px solid #1f1f1f;
  }}
  .day-col {{
    text-align: center;
    padding: 10px 2px 12px;
    border-right: 1px solid #1f1f1f;
  }}
  .day-col:last-child {{ border-right: none; }}
  .day-letter {{
    color: #fff;
    font-size: 16px;
    font-weight: 900;
  }}
  .day-num {{
    color: #777;
    font-size: 8px;
    margin-top: 2px;
    margin-bottom: 8px;
    font-weight: 400;
  }}
  .day-col .icon-wrap img {{
    width: 36px;
    height: 36px;
    object-fit: contain;
  }}

  /* ===================== MONTHLY GRID ===================== */
  .weekday-row {{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid #1f1f1f;
    padding: 6px 0;
  }}
  .weekday-row div {{
    text-align: center;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
  }}
  .month-grid {{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid #1f1f1f;
    border-bottom: 1px solid #1f1f1f;
  }}
  .day-cell {{
    position: relative;
    height: 46px;
    border-right: 1px solid #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
    padding: 4px 5px;
  }}
  .day-cell:nth-child(7n) {{ border-right: none; }}
  .day-cell .day-num {{
    color: #888;
    font-size: 8px;
    font-weight: 400;
    margin: 0;
  }}
  .day-cell .icon-wrap {{
    position: absolute;
    bottom: 3px;
    right: 4px;
  }}
  .day-cell .icon-wrap img {{
    width: 22px;
    height: 22px;
    object-fit: contain;
  }}
  .empty-cell {{
    border-right: 1px solid #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
    height: 46px;
  }}
  .empty-cell:nth-child(7n) {{ border-right: none; }}

  /* ===================== FOOTER (shared) ===================== */
  .footer {{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    flex-wrap: wrap;
    gap: 8px 0;
  }}
  .stat {{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px;
  }}
  .stat-icon {{
    width: 16px;
    height: 16px;
    object-fit: contain;
    flex-shrink: 0;
  }}
  .stat-text {{ display: flex; flex-direction: column; }}
  .stat-label {{
    color: #888;
    font-size: 6px;
    letter-spacing: 0.5px;
    font-weight: 400;
    white-space: nowrap;
  }}
  .stat-value {{
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.3px;
    margin-top: 1px;
    white-space: nowrap;
  }}
  .divider {{
    width: 1px;
    height: 22px;
    background: #2a2a2a;
    flex-shrink: 0;
  }}

  @media (max-width: 380px) {{
    .stat-label {{ font-size: 5.5px; }}
    .stat-value {{ font-size: 9.5px; }}
    .day-letter {{ font-size: 14px; }}
  }}
</style>
</head>
<body>

<div class="card">

  {monthly_bg_flame}

  <div class="header">
    <img class="avatar" src="{avatar_src}" alt="profile">
    <div class="user-info">
      <div class="user-name">{user_name}</div>
      <div class="user-tag">STAY FOCUSED.<br>STAY FREE.</div>
    </div>
    <div class="title-wrap">
      <div class="{title_class}">{title_text}</div>
      {subtitle_html}
    </div>
  </div>

  {grid_html}

  <div class="footer">
    <div class="stat">
      <img class="stat-icon" src="{img_dir}/fire.png" alt="fire">
      <div class="stat-text">
        <div class="stat-label">TOTAL STREAK</div>
        <div class="stat-value">{total_streak} DAYS</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <img class="stat-icon" src="{img_dir}/calendar.png" alt="calendar">
      <div class="stat-text">
        <div class="stat-label">TODAY</div>
        <div class="stat-value">{today_str}</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <img class="stat-icon" src="{img_dir}/clock.png" alt="clock">
      <div class="stat-text">
        <div class="stat-label">DAY</div>
        <div class="stat-value">{day_name}</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <img class="stat-icon" src="{img_dir}/calendar.png" alt="calendar">
      <div class="stat-text">
        <div class="stat-label">MONTH</div>
        <div class="stat-value">{month_name}</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
